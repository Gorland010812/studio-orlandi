<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Medico — Studio Orlandi</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    body { min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:linear-gradient(135deg,var(--verde-scuro),var(--teal)); padding:1rem; }
    .login-card { background:#fff; border-radius:14px; padding:2.5rem; width:100%; max-width:400px;
                  box-shadow:0 8px 40px rgba(0,0,0,.2); }
    .login-logo { text-align:center; margin-bottom:1.75rem; }
    .login-logo .icon { font-size:3rem; display:block; margin-bottom:.5rem; }
    .login-logo h2 { color:var(--verde-scuro); }
    .login-logo p  { color:#888; font-size:.85rem; }
    .back-link { display:block; text-align:center; margin-top:1.25rem; font-size:.85rem; color:rgba(255,255,255,.75); }
    .back-link:hover { color:#fff; }
  </style>
</head>
<body>
  <div>
    <div class="login-card">
      <div class="login-logo">
        <span class="icon">🩺</span>
        <h2>Area Medico</h2>
        <p id="login-subtitle">Inserisci le tue credenziali</p>
      </div>

      <div id="alert-container"></div>

      <!-- Form login normale -->
      <form id="form-login">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" required placeholder="es. orlandi">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Accedi</button>
      </form>

      <!-- Form primo accesso -->
      <form id="form-setup" class="hidden">
        <div class="alert alert-warning">
          Prima configurazione: imposta le tue credenziali di accesso.
        </div>
        <div class="form-group">
          <label>Scegli un username</label>
          <input type="text" id="setup-username" required placeholder="es. orlandi" minlength="3">
        </div>
        <div class="form-group">
          <label>Scegli una password</label>
          <input type="password" id="setup-password" required placeholder="minimo 6 caratteri" minlength="6">
        </div>
        <div class="form-group">
          <label>Conferma password</label>
          <input type="password" id="setup-confirm" required placeholder="ripeti la password">
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg">Configura e accedi</button>
      </form>
    </div>
    <a href="/" class="back-link">← Torna alla pagina iniziale</a>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    if (getToken()) window.location.href = '/medico/home.html';

    const alertBox = document.getElementById('alert-container');
    function errMsg(msg) {
      alertBox.innerHTML = `<div class="alert alert-error">${msg}</div>`;
    }

    // Controlla se primo accesso
    (async () => {
      try {
        const { needs_setup } = await api('/api/auth/needs-setup');
        if (needs_setup) {
          document.getElementById('form-login').classList.add('hidden');
          document.getElementById('form-setup').classList.remove('hidden');
          document.getElementById('login-subtitle').textContent = 'Primo accesso — configura le credenziali';
        }
      } catch(e) { /* continua con login normale */ }
    })();

    // Login normale
    document.getElementById('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Accesso...';
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          })
        });
        setToken(data.access_token);
        window.location.href = '/medico/home.html';
      } catch(e) {
        errMsg(e.message);
        btn.disabled = false; btn.textContent = 'Accedi';
      }
    });

    // Primo accesso / setup
    document.getElementById('form-setup').addEventListener('submit', async e => {
      e.preventDefault();
      alertBox.innerHTML = '';
      const pw  = document.getElementById('setup-password').value;
      const pw2 = document.getElementById('setup-confirm').value;
      if (pw !== pw2) { errMsg('Le password non coincidono'); return; }
      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Configurazione...';
      try {
        const data = await api('/api/auth/setup', {
          method: 'POST',
          body: JSON.stringify({
            username: document.getElementById('setup-username').value.trim(),
            password: pw,
          })
        });
        setToken(data.access_token);
        window.location.href = '/medico/home.html';
      } catch(e) {
        errMsg(e.message);
        btn.disabled = false; btn.textContent = 'Configura e accedi';
      }
    });
  </script>
</body>
</html>
