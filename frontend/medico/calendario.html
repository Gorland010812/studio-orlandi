<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario — Studio Orlandi</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .cal-wrap { padding:1.25rem; padding-top:calc(1.25rem + 64px); max-width:1100px; margin:0 auto; }
    .cal-header-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; flex-wrap:wrap; gap:.75rem; }
    .cal-stats { display:flex; gap:1.5rem; }
    .stat-item { text-align:center; }
    .stat-val { font-size:1.4rem; font-weight:700; color:var(--verde); }
    .stat-lbl { font-size:.75rem; color:#888; }
    .day-popup { position:absolute; background:#fff; border-radius:var(--radius); box-shadow:var(--ombra-card);
                 padding:1rem; z-index:100; min-width:220px; font-size:.85rem; }
    .app-row { display:flex; align-items:center; gap:.5rem; padding:.3rem 0; border-bottom:1px solid var(--grigio-bordo); }
    .app-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .search-paziente-results { position:absolute; background:#fff; border:1.5px solid var(--grigio-bordo);
      border-radius:var(--radius-sm); z-index:9999; width:100%; max-height:220px; overflow-y:auto;
      -webkit-overflow-scrolling:touch; box-shadow:var(--ombra); top:calc(100% + 2px); left:0;
      transform:translateZ(0); }
    .search-item { padding:.55rem .85rem; cursor:pointer; font-size:.88rem;
      border-bottom:1px solid var(--grigio-bordo); touch-action:manipulation; }
    .search-item:last-child { border-bottom:none; }
    .search-item:hover, .search-item:active { background:var(--verde-chiaro); }
    .tipo-badge { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.4rem; }
    .paziente-field-wrap { position:relative; display:flex; gap:.4rem; align-items:center; }
    .paziente-field-wrap input { flex:1; }
    /* Mobile list view */
    .cal-list { display:flex; flex-direction:column; gap:.5rem; }
    .cal-list-day { background:#fff; border-radius:var(--radius-sm); border:1px solid var(--grigio-bordo); overflow:hidden; box-shadow:4px 6px 0 rgba(74,122,74,.35); }
    .cal-list-day-hdr { display:flex; align-items:center; justify-content:space-between; padding:.6rem 1rem;
                        background:var(--verde-chiaro); cursor:pointer; }
    .cal-list-day-nome { font-weight:600; font-size:.9rem; color:var(--verde-scuro); text-transform:capitalize; }
    .cal-list-day-n { font-size:.75rem; color:var(--verde); font-weight:600; }
    .cal-list-event { display:flex; align-items:center; gap:.75rem; padding:.6rem 1rem;
                      border-top:1px solid var(--grigio-bordo); cursor:pointer; }
    .cal-list-event:hover { background:var(--verde-chiaro); }
    .cal-list-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .cal-list-info { flex:1; font-size:.88rem; }
    .cal-list-ora { font-size:.75rem; color:#888; }
    .cal-list-empty { padding:.6rem 1rem; font-size:.82rem; color:#bbb; border-top:1px solid var(--grigio-bordo); }
    .cal-view-btn { display:none; }
    /* Fix 17: giorni senza ambulatorio */
    .cal-cell.no-disp { opacity:.38; background:#f9f9f9; cursor:default !important; }
    .cal-cell.no-disp:hover { background:#f9f9f9; }
    .cal-list-day.no-disp { opacity:.38; }
    .cal-list-day.no-disp .cal-list-day-hdr { cursor:default; }
    /* Giorni passati: non cliccabili */
    .cal-cell.passato { opacity:.28; background:#f5f5f5; cursor:default !important; }
    .cal-cell.passato:hover { background:#f5f5f5; }
    .cal-cell.passato .cal-day-num { color:#bbb; }
    /* Ora slot */
    .ora-custom-wrap { margin-top:.35rem; }
    /* Popup slot rapido */
    .slot-popup { position:fixed; background:#fff; border:1.5px solid var(--grigio-bordo);
                  border-radius:var(--radius); box-shadow:var(--ombra-card);
                  padding:.5rem; z-index:500; min-width:148px; }
    .slot-popup-btn { display:block; width:100%; text-align:left; padding:.38rem .7rem;
                      border:none; background:none; border-radius:var(--radius-sm);
                      cursor:pointer; font-size:.88rem; font-family:inherit;
                      color:var(--verde-scuro); font-weight:500; }
    .slot-popup-btn:hover { background:var(--verde-chiaro); }
    .slot-popup-sep { border:none; border-top:1px solid var(--grigio-bordo); margin:.35rem 0; }
    .slot-popup-altro { display:block; width:100%; text-align:left; padding:.32rem .7rem;
                        border:none; background:none; border-radius:var(--radius-sm);
                        cursor:pointer; font-size:.8rem; font-family:inherit; color:#999; }
    .slot-popup-altro:hover { background:#f5f5f5; }
    .slot-popup-msg { font-size:.8rem; color:#aaa; padding:.35rem .7rem; }
    @media (max-width: 768px) {
      .cal-view-btn { display:inline-flex; }
      .cal-header-bar { flex-direction:column; align-items:flex-start; }
      .cal-nav h2 { min-width:auto; font-size:1rem; }
    }
  </style>
</head>
<body>
<header class="site-header">
  <div style="display:flex;align-items:center;gap:1rem">
    <a href="/medico/home.html" style="color:#fff;opacity:.75;font-size:1.2rem">←</a>
    <h1>Calendario Appuntamenti</h1>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary btn-sm" id="btn-nuovo-hdr">+ Nuovo appuntamento</button>
  </div>
</header>

<div class="cal-wrap">
  <div class="cal-header-bar">
    <div class="cal-nav">
      <button class="btn btn-secondary btn-sm" id="btn-prev-m">◀</button>
      <h2 id="mese-title" style="min-width:220px;text-align:center"></h2>
      <button class="btn btn-secondary btn-sm" id="btn-next-m">▶</button>
      <button class="btn btn-ghost btn-sm" id="btn-oggi">Oggi</button>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <div class="cal-stats">
        <div class="stat-item"><div class="stat-val" id="st-mese">—</div><div class="stat-lbl">questo mese</div></div>
        <div class="stat-item"><div class="stat-val" id="st-attesa">—</div><div class="stat-lbl">in attesa</div></div>
      </div>
      <div class="cal-view-btn" style="gap:.4rem;display:none" id="view-toggle">
        <button class="btn btn-secondary btn-sm active" id="btn-v-griglia" onclick="setVista('griglia')" title="Vista mese">📅</button>
        <button class="btn btn-secondary btn-sm" id="btn-v-lista" onclick="setVista('lista')" title="Vista lista">☰</button>
      </div>
    </div>
  </div>

  <div id="alert-cal"></div>

  <div id="cal-grid-wrap">
    <div class="cal-grid" id="cal-grid">
      <div class="cal-day-header">Lun</div>
      <div class="cal-day-header">Mar</div>
      <div class="cal-day-header">Mer</div>
      <div class="cal-day-header">Gio</div>
      <div class="cal-day-header">Ven</div>
      <div class="cal-day-header">Sab</div>
      <div class="cal-day-header">Dom</div>
    </div>
  </div>
  <div id="cal-list-wrap" class="hidden">
    <div class="cal-list" id="cal-list"></div>
  </div>
</div>

<!-- Popup slot rapido (posizionato via JS) -->
<div class="slot-popup hidden" id="slot-popup"></div>

<!-- Modal nuovo appuntamento -->
<div class="modal-overlay hidden" id="modal-nuovo">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Nuovo appuntamento</h3>
      <button class="modal-close" data-close-modal="modal-nuovo">×</button>
    </div>
    <div class="modal-body">
      <div id="alert-modal"></div>
      <div class="form-group">
        <label>Paziente</label>
        <div class="paziente-field-wrap" style="position:relative">
          <input type="text" id="search-paziente" placeholder="Cerca o seleziona paziente..." autocomplete="off">
          <button type="button" class="btn btn-icon hidden" id="btn-clear-paz" title="Rimuovi selezione" style="flex-shrink:0;font-size:1rem;padding:.35rem .55rem">×</button>
          <div class="search-paziente-results hidden" id="search-results"></div>
        </div>
        <input type="hidden" id="paziente-id-hidden">
        <input type="hidden" id="paz-tel-hidden">
        <input type="hidden" id="paz-email-hidden">
        <div class="hidden" id="paz-info-row" style="font-size:.82rem;color:#666;margin-top:.3rem;display:flex;gap:1.2rem;flex-wrap:wrap">
          <span id="paz-tel-display"></span>
          <span id="paz-email-display"></span>
        </div>
      </div>
      <div class="form-group">
        <label>Tipo visita</label>
        <select id="tipo-visita-sel"><option value="">— Seleziona —</option></select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Data</label>
          <input type="date" id="app-data">
        </div>
        <div class="form-group">
          <label>Ora</label>
          <select id="app-ora-sel">
            <option value="">— Prima seleziona data —</option>
          </select>
          <div class="ora-custom-wrap hidden" id="app-ora-custom-wrap">
            <input type="time" id="app-ora" step="300" style="width:100%">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Sede</label>
        <select id="sede-sel"><option value="">— Qualsiasi —</option></select>
      </div>
      <div class="form-group">
        <label>Stato</label>
        <select id="app-stato">
          <option value="confermato">Confermato</option>
          <option value="in_attesa">In attesa</option>
          <option value="completato">Completato</option>
          <option value="annullato">Annullato</option>
        </select>
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="app-note" rows="2"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm hidden" id="btn-elimina-app">Elimina</button>
      <button class="btn btn-secondary" data-close-modal="modal-nuovo">Annulla</button>
      <button class="btn btn-primary" id="btn-salva-app">Salva</button>
    </div>
  </div>
</div>

<script src="/assets/app.js"></script>
<script>
if (!requireAuth()) throw '';

let anno = new Date().getFullYear();
let mese = new Date().getMonth() + 1;
let appuntamenti = [];
let tipiVisita = [];
let sedi = [];
let disponibilita = [];
let dispSet = new Set();
let appCorrenteId = null;

/* ── Fix 8: data di oggi come stringa ISO ─────────────────────────────────── */
function dataOggiISO() {
  const o = new Date();
  return `${o.getFullYear()}-${String(o.getMonth()+1).padStart(2,'0')}-${String(o.getDate()).padStart(2,'0')}`;
}

/* ── Calendario ──────────────────────────────────────────────────────────── */
async function caricaMese() {
  document.getElementById('mese-title').textContent = `${nomeMese(mese-1)} ${anno}`;
  try {
    appuntamenti = await api(`/api/appuntamenti/mese/${anno}/${mese}`);
    if (vistaCorrente === 'lista') { renderLista(); } else { renderCalendario(); }
    aggiornaStats();
  } catch(e) {}
}

function renderCalendario() {
  const grid = document.getElementById('cal-grid');
  while (grid.children.length > 7) grid.removeChild(grid.lastChild);

  const primoGiorno = new Date(anno, mese-1, 1);
  const ultimoGiorno = new Date(anno, mese, 0);
  const oggi = new Date();
  const oggiISO = dataOggiISO();

  let offset = primoGiorno.getDay() - 1;
  if (offset < 0) offset = 6;

  for (let i = 0; i < offset; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell fuori-mese';
    const prevDay = new Date(anno, mese-1, -offset+i+1);
    cell.innerHTML = `<div class="cal-day-num">${prevDay.getDate()}</div>`;
    grid.appendChild(cell);
  }

  for (let g = 1; g <= ultimoGiorno.getDate(); g++) {
    const dataStr = `${anno}-${String(mese).padStart(2,'0')}-${String(g).padStart(2,'0')}`;
    const isOggi = oggi.getFullYear()===anno && oggi.getMonth()===mese-1 && oggi.getDate()===g;
    const isPassato = dataStr < oggiISO;
    const d = new Date(anno, mese-1, g);
    const dow = d.getDay() === 0 ? 6 : d.getDay() - 1; // 0=Lun
    const hasDisp = dispSet.size === 0 || dispSet.has(dow);

    const cell = document.createElement('div');
    cell.dataset.data = dataStr;

    // Giorno passato: grigio, nessun evento, non cliccabile
    if (isPassato) {
      cell.className = 'cal-cell passato';
      cell.innerHTML = `<div class="cal-day-num">${g}</div>`;
      grid.appendChild(cell);
      continue;
    }

    if (!hasDisp) {
      // Giorno senza ambulatorio
      cell.className = 'cal-cell no-disp' + (isOggi ? ' oggi' : '');
      cell.innerHTML = `<div class="cal-day-num">${g}</div>`;
      grid.appendChild(cell);
      continue;
    }

    cell.className = 'cal-cell' + (isOggi ? ' oggi' : '');
    const appGiorno = appuntamenti.filter(a => a.data_ora.startsWith(dataStr));
    const MAX = 3;
    let html = `<div class="cal-day-num">${g}</div>`;
    appGiorno.slice(0, MAX).forEach(a => {
      const ora = a.data_ora.slice(11,16);
      html += `<div class="cal-event" style="background:${a.tipo_visita_colore||'#6a9e6a'}"
               data-id="${a.id}" title="${a.nome_display}">${ora} ${a.nome_display}</div>`;
    });
    if (appGiorno.length > MAX) html += `<div class="cal-more">+${appGiorno.length-MAX} altri</div>`;
    cell.innerHTML = html;

    cell.addEventListener('click', e => {
      if (e.target.classList.contains('cal-event')) {
        apriModifica(parseInt(e.target.dataset.id));
      } else {
        apriSlotPopup(dataStr, cell, e);
      }
    });
    grid.appendChild(cell);
  }

  const totale = offset + ultimoGiorno.getDate();
  const righe = Math.ceil(totale / 7);
  const celle = righe * 7;
  for (let i = totale + 1; i <= celle; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell fuori-mese';
    cell.innerHTML = `<div class="cal-day-num">${i-totale}</div>`;
    grid.appendChild(cell);
  }
}

function aggiornaStats() {
  document.getElementById('st-mese').textContent = appuntamenti.filter(a=>a.stato!=='annullato').length;
  document.getElementById('st-attesa').textContent = appuntamenti.filter(a=>a.stato==='in_attesa').length;
}

/* ── Modal ───────────────────────────────────────────────────────────────── */
function apriNuovo(dataStr = '', oraStr = '') {
  appCorrenteId = null;
  document.getElementById('modal-title').textContent = 'Nuovo appuntamento';
  document.getElementById('btn-elimina-app').classList.add('hidden');
  resetModal();
  if (dataStr) {
    document.getElementById('app-data').value = dataStr;
    aggiornaSlotOra(oraStr, false);
  }
  openModal('modal-nuovo');
}

async function apriModifica(id) {
  appCorrenteId = id;
  document.getElementById('modal-title').textContent = 'Modifica appuntamento';
  document.getElementById('btn-elimina-app').classList.remove('hidden');
  resetModal();
  const a = appuntamenti.find(x => x.id === id);
  if (!a) return;
  const dataStr = a.data_ora.slice(0,10);
  const oraStr  = a.data_ora.slice(11,16);
  document.getElementById('app-data').value = dataStr;
  document.getElementById('tipo-visita-sel').value = a.tipo_visita_id || '';
  document.getElementById('sede-sel').value  = a.sede_id || '';
  document.getElementById('app-stato').value = a.stato;
  document.getElementById('app-note').value  = a.note || '';
  if (a.paziente_id) {
    setPazienteSelezionato(a.paziente_id, a.nome_display, { telefono: a.telefono_paziente, email: a.email_paziente });
  } else if (a.nome_display && a.nome_display !== '—') {
    setPazienteSelezionato('', a.nome_display, { telefono: a.telefono_paziente, email: a.email_paziente });
  }
  // Carica slot per la data, poi seleziona l'ora corrente
  await aggiornaSlotOra(oraStr, true);
  openModal('modal-nuovo');
}

function resetModal() {
  document.getElementById('alert-modal').innerHTML = '';
  document.getElementById('search-paziente').value = '';
  document.getElementById('search-paziente').style.fontWeight = 'normal';
  document.getElementById('paziente-id-hidden').value = '';
  document.getElementById('btn-clear-paz').classList.add('hidden');
  document.getElementById('search-results').classList.add('hidden');
  document.getElementById('paz-tel-hidden').value = '';
  document.getElementById('paz-email-hidden').value = '';
  document.getElementById('paz-info-row').classList.add('hidden');
  document.getElementById('app-data').value = '';
  document.getElementById('app-ora-sel').innerHTML = '<option value="">— Prima seleziona data —</option>';
  document.getElementById('app-ora').value = '';
  document.getElementById('app-ora-custom-wrap').classList.add('hidden');
  document.getElementById('tipo-visita-sel').value = '';
  document.getElementById('sede-sel').value = '';
  document.getElementById('app-stato').value = 'confermato';
  document.getElementById('app-note').value = '';
}

function setPazienteSelezionato(id, label, paz = null) {
  document.getElementById('paziente-id-hidden').value = id;
  document.getElementById('search-paziente').value = label;
  document.getElementById('search-paziente').style.fontWeight = '600';
  document.getElementById('btn-clear-paz').classList.remove('hidden');
  document.getElementById('search-results').classList.add('hidden');
  const tel = paz?.telefono || '';
  const email = paz?.email || '';
  document.getElementById('paz-tel-hidden').value = tel;
  document.getElementById('paz-email-hidden').value = email;
  document.getElementById('paz-tel-display').textContent = tel ? '☎ ' + tel : '';
  document.getElementById('paz-email-display').textContent = email ? '✉ ' + email : '';
  document.getElementById('paz-info-row').classList.toggle('hidden', !tel && !email);
}

/* ── Slot orario nel modal ────────────────────────────────────────────────── */
// labelAttuale=true → mostra "(attuale)" per la modifica di un appuntamento esistente
// labelAttuale=false → pre-seleziona l'ora senza etichetta aggiuntiva (nuovo appuntamento)
async function aggiornaSlotOra(oraPreselezionata = '', labelAttuale = true) {
  const data  = document.getElementById('app-data').value;
  const tvId  = document.getElementById('tipo-visita-sel').value;
  const sel   = document.getElementById('app-ora-sel');
  if (!data) return;

  const durata = tvId
    ? (tipiVisita.find(tv => tv.id === parseInt(tvId))?.durata_minuti || 30)
    : 30;

  sel.innerHTML = '<option value="">Caricamento...</option>';
  try {
    const res = await api(`/api/appuntamenti/slot-liberi?data=${data}&durata_minuti=${durata}`);
    sel.innerHTML = '';
    if (!res.ha_disponibilita) {
      sel.innerHTML = '<option value="">⚠ Giorno senza ambulatorio</option>';
    } else {
      if (oraPreselezionata) {
        // Slot passato dall'esterno: mostralo come prima opzione pre-selezionata
        const opt = document.createElement('option');
        opt.value = oraPreselezionata;
        opt.textContent = labelAttuale
          ? `${oraPreselezionata} (attuale)`
          : oraPreselezionata;
        opt.selected = true;
        sel.appendChild(opt);
      } else {
        const blank = document.createElement('option');
        blank.value = '';
        blank.textContent = '— Seleziona orario —';
        sel.appendChild(blank);
      }
      res.slot.forEach(ora => {
        if (ora === oraPreselezionata) return; // già mostrato sopra
        const o = document.createElement('option');
        o.value = ora; o.textContent = ora;
        sel.appendChild(o);
      });
      if (!res.slot.length && !oraPreselezionata) {
        sel.innerHTML = '<option value="">Nessuno slot libero</option>';
      }
    }
  } catch(e) {
    sel.innerHTML = '<option value="">Errore slot</option>';
  }
  const custom = document.createElement('option');
  custom.value = 'custom'; custom.textContent = '⌨ Orario personalizzato...';
  sel.appendChild(custom);
  document.getElementById('app-ora-custom-wrap').classList.add('hidden');
}

/* ── Popup slot rapido ────────────────────────────────────────────────────── */
function chiudiSlotPopup() {
  document.getElementById('slot-popup').classList.add('hidden');
}

async function apriSlotPopup(dataStr, anchorEl, e) {
  if (e) e.stopPropagation();
  chiudiSlotPopup();

  const popup = document.getElementById('slot-popup');
  popup.innerHTML = '<div class="slot-popup-msg">Caricamento...</div>';
  popup.classList.remove('hidden');

  // Posiziona il popup sotto l'elemento cliccato
  const rect = anchorEl.getBoundingClientRect();
  let top  = rect.bottom + 4;
  let left = rect.left;
  // Evita uscita dallo schermo a destra
  const pw = 160;
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  popup.style.top  = top + 'px';
  popup.style.left = left + 'px';

  try {
    const res = await api(`/api/appuntamenti/slot-liberi?data=${dataStr}&durata_minuti=30`);
    popup.innerHTML = '';

    if (!res.ha_disponibilita) {
      popup.innerHTML = '<div class="slot-popup-msg">⚠ Giorno senza ambulatorio</div>';
    } else if (!res.slot.length) {
      popup.innerHTML = '<div class="slot-popup-msg">Nessuno slot libero</div>';
    } else {
      res.slot.slice(0, 8).forEach(ora => {
        const btn = document.createElement('button');
        btn.className = 'slot-popup-btn';
        btn.textContent = ora;
        btn.addEventListener('click', ev => {
          ev.stopPropagation();
          chiudiSlotPopup();
          apriNuovo(dataStr, ora);
        });
        popup.appendChild(btn);
      });
      const sep = document.createElement('hr');
      sep.className = 'slot-popup-sep';
      popup.appendChild(sep);
    }

    // Sempre disponibile: apri il modal senza orario pre-selezionato
    const altro = document.createElement('button');
    altro.className = 'slot-popup-altro';
    altro.textContent = '⌨ Altro orario...';
    altro.addEventListener('click', ev => {
      ev.stopPropagation();
      chiudiSlotPopup();
      apriNuovo(dataStr);
    });
    popup.appendChild(altro);

    // Riposiziona ora che abbiamo l'altezza reale
    if (top + popup.offsetHeight > window.innerHeight - 8) {
      popup.style.top = (rect.top - popup.offsetHeight - 4) + 'px';
    }
  } catch(err) {
    popup.innerHTML = '<div class="slot-popup-msg">Errore caricamento</div>';
  }
}

// Chiudi il popup cliccando fuori
document.addEventListener('click', chiudiSlotPopup);
document.getElementById('slot-popup').addEventListener('click', e => e.stopPropagation());

/* ── Ricerca paziente nel modal (combobox) ───────────────────────────────── */
let searchTimer2;

async function mostraPazienti(q) {
  const box = document.getElementById('search-results');
  if (q.length < 2) { box.classList.add('hidden'); return; }
  try {
    const risultati = await api(`${window.location.origin}/api/pazienti/cerca?q=${encodeURIComponent(q)}`);
    box.innerHTML = '';
    if (!risultati || !risultati.length) {
      box.innerHTML = '<div class="search-item" style="color:#bbb;cursor:default">Nessun paziente trovato</div>';
    } else {
      risultati.forEach(p => {
        const d = document.createElement('div');
        d.className = 'search-item';
        let info = `${p.cognome} ${p.nome}`;
        if (p.data_nascita) info += ' · ' + fmtData(p.data_nascita);
        const luogo = [p.luogo_nascita, p.provincia_nascita].filter(Boolean).join(' ');
        if (luogo) info += ' (' + luogo + ')';
        d.textContent = info;
        d.addEventListener('mousedown', e => {
          e.preventDefault();
          setPazienteSelezionato(p.id, `${p.cognome} ${p.nome}`, p);
        });
        box.appendChild(d);
      });
    }
    box.classList.remove('hidden');
  } catch(e) {
    console.error('Ricerca paziente:', e);
    box.innerHTML = `<div class="search-item" style="color:#c00;cursor:default">Errore ricerca: ${e.message}</div>`;
    box.classList.remove('hidden');
  }
}

const elSearchPaz = document.getElementById('search-paziente');

elSearchPaz.addEventListener('focus', () => {
  if (document.getElementById('paziente-id-hidden').value) return;
  if (elSearchPaz.value.trim().length >= 2) mostraPazienti(elSearchPaz.value.trim());
});

function _triggerRicerca() {
  clearTimeout(searchTimer2);
  document.getElementById('paziente-id-hidden').value = '';
  document.getElementById('search-paziente').style.fontWeight = 'normal';
  document.getElementById('btn-clear-paz').classList.add('hidden');
  searchTimer2 = setTimeout(() => mostraPazienti(elSearchPaz.value.trim()), 250);
}

elSearchPaz.addEventListener('input',          _triggerRicerca);
elSearchPaz.addEventListener('keyup',          _triggerRicerca);
elSearchPaz.addEventListener('compositionend', _triggerRicerca);

elSearchPaz.addEventListener('blur', () => {
  setTimeout(() => document.getElementById('search-results').classList.add('hidden'), 180);
});

document.getElementById('btn-clear-paz').addEventListener('click', () => {
  document.getElementById('paziente-id-hidden').value = '';
  document.getElementById('search-paziente').value = '';
  document.getElementById('search-paziente').style.fontWeight = 'normal';
  document.getElementById('btn-clear-paz').classList.add('hidden');
  elSearchPaz.focus();
});

/* ── Salva appuntamento ───────────────────────────────────────────────────── */
document.getElementById('btn-salva-app').addEventListener('click', async () => {
  const alertM = document.getElementById('alert-modal');
  const data = document.getElementById('app-data').value;
  const oraSel = document.getElementById('app-ora-sel').value;
  const ora = oraSel === 'custom' ? document.getElementById('app-ora').value : oraSel;
  if (!data || !ora) {
    alertM.innerHTML='<div class="alert alert-error">Data e ora obbligatorie</div>';
    return;
  }
  const body = {
    data_ora: `${data}T${ora}:00`,
    tipo_visita_id: parseInt(document.getElementById('tipo-visita-sel').value) || null,
    sede_id: parseInt(document.getElementById('sede-sel').value) || null,
    paziente_id: parseInt(document.getElementById('paziente-id-hidden').value) || null,
    stato: document.getElementById('app-stato').value,
    note: document.getElementById('app-note').value || null,
    telefono_paziente: document.getElementById('paz-tel-hidden').value || null,
    email_paziente: document.getElementById('paz-email-hidden').value || null,
  };
  try {
    if (appCorrenteId) {
      await api(`/api/appuntamenti/${appCorrenteId}`, { method:'PUT', body:JSON.stringify(body) });
    } else {
      await api('/api/appuntamenti', { method:'POST', body:JSON.stringify(body) });
    }
    closeModal('modal-nuovo');
    caricaMese();
  } catch(e) { alertM.innerHTML=`<div class="alert alert-error">${e.message}</div>`; }
});

document.getElementById('btn-elimina-app').addEventListener('click', async () => {
  if (!confirm('Eliminare questo appuntamento?')) return;
  try {
    await api(`/api/appuntamenti/${appCorrenteId}`, { method:'DELETE' });
    closeModal('modal-nuovo');
    caricaMese();
  } catch(e) { alert(e.message); }
});

/* ── Vista lista (mobile) ──────────────────────────────────────────────── */
let vistaCorrente = 'griglia';

function setVista(v) {
  vistaCorrente = v;
  document.getElementById('cal-grid-wrap').classList.toggle('hidden', v === 'lista');
  document.getElementById('cal-list-wrap').classList.toggle('hidden', v === 'griglia');
  document.getElementById('btn-v-griglia').classList.toggle('active', v === 'griglia');
  document.getElementById('btn-v-lista').classList.toggle('active', v === 'lista');
  if (v === 'lista') renderLista();
}

function renderLista() {
  const list = document.getElementById('cal-list');
  list.innerHTML = '';
  const ultimoGiorno = new Date(anno, mese, 0).getDate();
  const oggi = new Date();
  const oggiISO = dataOggiISO();
  const isMeseCorrente = oggi.getFullYear() === anno && oggi.getMonth() + 1 === mese;

  for (let g = 1; g <= ultimoGiorno; g++) {
    const dataStr = `${anno}-${String(mese).padStart(2,'0')}-${String(g).padStart(2,'0')}`;
    // Salta giorni passati (precedenti a oggi)
    if (dataStr < oggiISO) continue;

    const d = new Date(anno, mese-1, g);
    const isOggi = isMeseCorrente && g === oggi.getDate();
    const dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
    const hasDisp = dispSet.size === 0 || dispSet.has(dow);

    // Nascondi giorni senza ambulatorio
    if (!hasDisp) continue;

    const appGiorno = appuntamenti.filter(a => a.data_ora.startsWith(dataStr));
    const dayEl = document.createElement('div');
    dayEl.className = 'cal-list-day' + (isOggi ? ' oggi' : '');
    if (isOggi) dayEl.style.borderColor = 'var(--giallo)';

    const nomeG = nomeGiorno(dow);
    const hdr = document.createElement('div');
    hdr.className = 'cal-list-day-hdr';
    hdr.innerHTML = `<span class="cal-list-day-nome">${nomeG} ${g} ${nomeMese(mese-1).toLowerCase()}</span>
      <span class="cal-list-day-n">${appGiorno.length ? appGiorno.length + ' appt' : '+ Aggiungi'}</span>`;
    hdr.addEventListener('click', e => apriSlotPopup(dataStr, hdr, e));
    dayEl.appendChild(hdr);

    if (appGiorno.length) {
      appGiorno.forEach(a => {
        const ev = document.createElement('div');
        ev.className = 'cal-list-event';
        ev.innerHTML = `<div class="cal-list-dot" style="background:${a.tipo_visita_colore||'#6a9e6a'}"></div>
          <div class="cal-list-info">
            <div style="font-weight:600">${a.nome_display}</div>
            <div class="cal-list-ora">${a.data_ora.slice(11,16)}${a.tipo_visita_nome ? ' · '+a.tipo_visita_nome : ''}</div>
          </div>`;
        ev.addEventListener('click', e => { e.stopPropagation(); apriModifica(a.id); });
        dayEl.appendChild(ev);
      });
    } else {
      const empty = document.createElement('div');
      empty.className = 'cal-list-empty';
      empty.textContent = 'Nessun appuntamento';
      dayEl.appendChild(empty);
    }
    list.appendChild(dayEl);
  }
}

/* ── Nav mese ─────────────────────────────────────────────────────────────── */

});

(async () => {
  // Fix 17: carica disponibilità per graying dei giorni
  try {
    disponibilita = await api('/api/disponibilita');
    dispSet = new Set(disponibilita.filter(d => d.attivo).map(d => d.giorno_settimana));
  } catch(e) {}

  try {
    tipiVisita = await api('/api/tipi-visita');
    const sel = document.getElementById('tipo-visita-sel');
    tipiVisita.forEach(tv => {
      const o = document.createElement('option');
      o.value = tv.id; o.textContent = `${tv.nome} (${tv.durata_minuti}min)`;
      sel.appendChild(o);
    });
  } catch(e) {}

  try {
    sedi = await api('/api/sedi');
    const sel = document.getElementById('sede-sel');
    sedi.forEach(s => {
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.nome;
      sel.appendChild(o);
    });
  } catch(e) {}

  caricaMese();
})();
</script>
