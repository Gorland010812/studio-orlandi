<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home — Studio Orlandi</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .home-body { min-height:100vh; background:var(--grigio-bg); padding-top:64px; }
    .home-content { padding:2rem 1.5rem; max-width:860px; margin:0 auto; }
    .oggi-strip { background:#fff; border-radius:var(--radius); padding:1rem 1.5rem; margin-bottom:2rem;
                  box-shadow:4px 6px 0 rgba(74,122,74,.35); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
    .oggi-label { font-size:.85rem; color:#888; }
    .oggi-count { font-size:1.6rem; font-weight:700; color:var(--verde); }

    .moduli-4 {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1.25rem;
    }
    .modulo-card-lg {
      background:#fff;
      border-radius:var(--radius);
      box-shadow:4px 6px 0 rgba(74,122,74,.35);
      padding:2rem 1.5rem;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:.75rem; cursor:pointer; text-decoration:none; color:inherit;
      transition:transform .15s, box-shadow .15s;
      min-height:150px;
      text-align:center;
    }
    .modulo-card-lg:hover  { transform:translateY(-2px); box-shadow:4px 8px 0 rgba(74,122,74,.35); }
    .modulo-card-lg:active { transform:translateY(2px); box-shadow:1px 3px 0 rgba(74,122,74,.35); }
    .modulo-card-lg .m-icon { font-size:2.25rem; line-height:1; }
    .modulo-card-lg h3 { font-size:1.05rem; font-weight:700; margin:0; }
    .modulo-card-lg p  { font-size:.8rem; color:#888; margin:0; }
    .modulo-card-lg[data-col="verde"]  { border-top-color: var(--verde); }
    .modulo-card-lg[data-col="teal"]   { border-top-color: var(--teal); }
    .modulo-card-lg[data-col="viola"]  { border-top-color: #8e44ad; }
    .modulo-card-lg[data-col="grigio"] { border-top-color: #95a5a6; }
    .modulo-card-lg.placeholder { opacity:.75; }
    .modulo-card-lg .cal-svg { display:block; color:var(--grigio-testo); }

    @media (max-width:500px) {
      .moduli-4 { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="home-body">

  <header class="site-header">
    <div>
      <h1>Studio Orlandi</h1>
      <div class="subtitle" id="nome-medico-header"></div>
    </div>
    <div class="header-actions">
      <div id="data-oggi" style="font-size:.8rem;opacity:.85;text-align:right;line-height:1.35"></div>
      <span style="font-size:1.6rem">🩺</span>
    </div>
  </header>

  <div id="alert-home" style="position:fixed;top:1rem;right:1rem;z-index:999;min-width:240px"></div>
  <div class="home-content">
    <div class="oggi-strip">
      <div>
        <div class="oggi-label">Appuntamenti oggi</div>
        <div class="oggi-count" id="count-oggi">—</div>
      </div>
      <div style="border-left:1px solid var(--grigio-bordo);padding-left:1rem">
        <div class="oggi-label">Questo mese</div>
        <div class="oggi-count" id="count-mese">—</div>
      </div>
    </div>

    <div class="moduli-4">
      <a href="/medico/anagrafica.html" class="modulo-card-lg">
        <div class="m-icon">👥</div>
        <h3>Anagrafica</h3>
        <p>Gestione pazienti</p>
      </a>
      <a href="/medico/calendario.html" class="modulo-card-lg">
        <div class="m-icon">
          <svg class="cal-svg" xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <h3>Appuntamenti</h3>
        <p>Calendario e prenotazioni</p>
      </a>
      <div class="modulo-card-lg placeholder" onclick="mostraModuloInArrivo()">
        <div class="m-icon">🧬</div>
        <h3>dYagnosis</h3>
        <p>Modulo in arrivo</p>
      </div>
      <a href="/medico/impostazioni.html" class="modulo-card-lg">
        <div class="m-icon">⚙️</div>
        <h3>Impostazioni</h3>
        <p>Configurazione studio</p>
      </a>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    if (!requireAuth()) throw '';

    function mostraModuloInArrivo() {
      showAlert('Modulo dYagnosis in arrivo', 'info', document.getElementById('alert-home'));
    }

    const oggi = new Date();
    document.getElementById('data-oggi').innerHTML =
      oggi.toLocaleDateString('it-IT', { weekday:'long', day:'numeric', month:'long' })
      + '<br>' + oggi.getFullYear();

    (async () => {
      try {
        const me = await api('/api/auth/me');
        document.getElementById('nome-medico-header').textContent = me.nome_medico;
      } catch(e) {}

      try {
        const anno = oggi.getFullYear(), mese = oggi.getMonth() + 1;
        const app = await api(`/api/appuntamenti/mese/${anno}/${mese}`);
        document.getElementById('count-mese').textContent = app.length;
        const oggiStr = oggi.toISOString().slice(0,10);
        document.getElementById('count-oggi').textContent =
          app.filter(a => a.data_ora.startsWith(oggiStr)).length;
      } catch(e) {}
    })();
  </script>
</body>
</html>
