<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anagrafica — Studio Orlandi</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .anag-layout { display:flex; height:calc(100vh - 64px); margin-top:64px; }
    .anag-sidebar { width:270px; min-width:220px; background:#fff; border-right:1px solid var(--grigio-bordo);
                    display:flex; flex-direction:column; flex-shrink:0; }
    .anag-main { flex:1; overflow-y:auto; background:var(--grigio-bg); }
    .anag-toolbar { display:flex; gap:.5rem; padding:.75rem 1rem; border-bottom:1px solid var(--grigio-bordo); }
    .anag-toolbar input { flex:1; padding:.45rem .75rem; border:1.5px solid var(--grigio-bordo); border-radius:var(--radius-sm); }
    .pt-list { flex:1; overflow-y:auto; }
    .pt-item { padding:.65rem 1rem; border-bottom:1px solid var(--grigio-bordo); cursor:pointer; transition:background .12s; }
    .pt-item:hover  { background:var(--verde-chiaro); }
    .pt-item.active { background:var(--verde-chiaro); border-left:3px solid var(--verde); }
    .pt-item .pn   { font-weight:600; font-size:.88rem; }
    .pt-item .pd   { font-size:.76rem; color:#888; }
    .pt-count { font-size:.75rem; color:#888; padding:.5rem 1rem; border-top:1px solid var(--grigio-bordo); }
    .detail-card { background:#fff; border-radius:var(--radius); margin:1.25rem; box-shadow:4px 6px 0 rgba(74,122,74,.35); }
    .detail-header { display:flex; align-items:center; justify-content:space-between;
                     padding:1rem 1.5rem; border-bottom:1px solid var(--grigio-bordo); }
    .detail-nav { display:flex; gap:.5rem; align-items:center; }
    .patient-name-big { font-size:1.2rem; font-weight:700; color:var(--verde-scuro); }
    .patient-cf { font-size:.82rem; color:#888; font-family:monospace; }
    .detail-body { padding:1.25rem 1.5rem; }
    .form-section { margin-bottom:1.5rem; }
    .form-section h4 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:#888;
                        margin-bottom:.75rem; padding-bottom:.35rem; border-bottom:1px solid var(--grigio-bordo); }
    .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
                   height:100%; color:#bbb; gap:1rem; padding:2rem; text-align:center; }
    .empty-state .e-icon { font-size:3rem; }
    .dup-banner { background:#fff3cd; border:1px solid #ffc107; border-radius:var(--radius-sm);
                  padding:.6rem 1rem; font-size:.85rem; margin-bottom:1rem; }
    .btn-back-mobile { display:none; }
    @media (max-width: 768px) {
      .anag-layout { flex-direction:column; height:auto; min-height:calc(100vh - 64px); }
      .anag-sidebar { width:100%; height:auto; min-width:unset; border-right:none; border-bottom:1px solid var(--grigio-bordo); max-height:260px; }
      .pt-list { max-height:190px; }
      .anag-main { min-height:50vh; }
      .btn-back-mobile { display:inline-flex; margin:.75rem 1rem 0; }
    }

    /* ── Autocomplete custom (sostituisce <datalist> non stilizzabile su iOS) ── */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid var(--verde);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      box-shadow: 0 6px 20px rgba(0,0,0,.18);
      z-index: 3000;
      max-height: 220px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .autocomplete-list.hidden { display: none; }
    .autocomplete-item {
      padding: .55rem .85rem;
      cursor: pointer;
      font-size: .92rem;
      color: var(--grigio-testo);
      background: #ffffff;
      border-bottom: 1px solid #f0f2f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover,
    .autocomplete-item.ac-focused {
      background: var(--verde-chiaro);
      color: var(--verde-scuro);
    }

    /* ── Stato "salvato" del pulsante Salva ─────────────────────────────────── */
    #btn-salva.btn-saved {
      background: #d4edda;
      color: #155724;
      border: 1.5px solid #b1dfbb;
      opacity: 1;          /* sovrascrive la regola .btn:disabled { opacity:.5 } */
      cursor: default;
    }
  </style>
</head>
<body>
<header class="site-header">
  <div style="display:flex;align-items:center;gap:1rem">
    <a href="/medico/home.html" style="color:#fff;opacity:.75;font-size:1.2rem">←</a>
    <h1>Anagrafica Pazienti</h1>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary btn-sm" id="btn-nuovo">+ Nuovo paziente</button>
  </div>
</header>

<div class="anag-layout">
  <!-- Sidebar lista -->
  <div class="anag-sidebar">
    <div class="anag-toolbar">
      <input type="search" id="search-input" placeholder="Cerca paziente...">
    </div>
    <div class="pt-list" id="pt-list"></div>
    <div class="pt-count" id="pt-count"></div>
  </div>

  <!-- Pannello dettaglio -->
  <div class="anag-main" id="anag-main">
    <button class="btn btn-secondary btn-sm btn-back-mobile hidden" id="btn-back-lista" onclick="document.querySelector('.anag-sidebar').scrollIntoView({behavior:'smooth'})">← Lista pazienti</button>
    <div class="empty-state">
      <div class="e-icon">👥</div>
      <p>Seleziona un paziente dalla lista<br>o crea un nuovo profilo.</p>
    </div>
  </div>
</div>

<!-- Template scheda paziente -->
<template id="tpl-scheda">
<div class="detail-card">
  <div class="detail-header">
    <div>
      <div class="patient-name-big" id="hdr-nome">—</div>
      <div class="patient-cf" id="hdr-cf"></div>
    </div>
    <div class="detail-nav">
      <button class="btn btn-icon" id="btn-prev" title="Precedente">◀</button>
      <button class="btn btn-icon" id="btn-next" title="Successivo">▶</button>
      <button class="btn btn-danger btn-sm" id="btn-elimina">Elimina</button>
    </div>
  </div>

  <div class="detail-body" role="presentation">
    <div id="dup-banner" class="dup-banner hidden"></div>
    <div id="alert-scheda"></div>

    <div class="tabs" id="tabs-anag">
      <button class="tab-btn active" data-tab="tab-anagrafica">Anagrafica</button>
      <button class="tab-btn" data-tab="tab-contatti">Contatti</button>
      <button class="tab-btn" data-tab="tab-info">Informazioni</button>
    </div>

    <!-- Campi fittizi per impedire al browser di proporre la rubrica -->
    <input type="text" name="fake-user" style="display:none" autocomplete="username" tabindex="-1" aria-hidden="true">
    <input type="password" name="fake-pass" style="display:none" autocomplete="new-password" tabindex="-1" aria-hidden="true">

    <!-- Tab Anagrafica -->
    <div id="tab-anagrafica" class="tab-panel active">
      <div class="form-section">
        <h4>Dati anagrafici</h4>
        <div class="form-row">
          <div class="form-group">
            <label>Cognome *</label>
            <div class="autocomplete-wrap">
              <input id="f-pax-cognome" required autocomplete="new-password">
              <div class="autocomplete-list hidden" id="list-pax-cognome"></div>
            </div>
          </div>
          <div class="form-group"><label>Nome *</label><input id="f-pax-nome" required autocomplete="new-password"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Data di nascita</label><input id="f-data-nascita" type="date" autocomplete="new-password"></div>
          <div class="form-group">
            <label>Sesso</label>
            <select id="f-sesso"><option value="">—</option><option value="M">Maschio</option><option value="F">Femmina</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Comune di nascita</label>
            <div class="autocomplete-wrap">
              <input id="f-comune-nascita-cerca" autocomplete="off" placeholder="Digita il comune...">
              <div class="autocomplete-list hidden" id="list-comuni-nasc"></div>
            </div>
            <input id="f-comune-nascita" type="hidden">
          </div>
          <div class="form-group">
            <label>Provincia di nascita</label>
            <input id="f-prov-nascita" maxlength="2" style="text-transform:uppercase" placeholder="Sigla (auto)" autocomplete="new-password">
          </div>
        </div>
        <div class="form-group">
          <label>Luogo di nascita (libero)</label>
          <input id="f-luogo-nascita" placeholder="Usato se comune non in lista" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label>Codice Fiscale</label>
          <input id="f-cf" style="font-family:monospace;letter-spacing:.05em;text-transform:uppercase" placeholder="Calcolato automaticamente" autocomplete="new-password">
        </div>
      </div>

      <div class="form-section">
        <h4>Residenza</h4>
        <div class="form-group">
          <label>Comune</label>
          <div class="autocomplete-wrap">
            <input id="f-comune-res" autocomplete="off" placeholder="Digita il comune...">
            <div class="autocomplete-list hidden" id="list-comuni-res"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Provincia</label>
            <input id="f-prov-res" maxlength="2" style="text-transform:uppercase" placeholder="Sigla (auto)" autocomplete="new-password">
          </div>
          <div class="form-group"><label>CAP</label><input id="f-cap" maxlength="5" autocomplete="new-password"></div>
        </div>
        <div class="form-group"><label>Indirizzo</label><input id="f-indirizzo" autocomplete="new-password"></div>
      </div>
    </div>

    <!-- Tab Contatti -->
    <div id="tab-contatti" class="tab-panel">
      <div class="form-section">
        <h4>Recapiti</h4>
        <div class="form-row">
          <div class="form-group"><label>Telefono</label><input id="f-telefono" type="tel" autocomplete="new-password"></div>
          <div class="form-group"><label>Email</label><input id="f-email" type="email" autocomplete="new-password"></div>
        </div>
      </div>
      <div class="form-section">
        <h4>Medico e riferimenti</h4>
        <div class="form-group"><label>Medico di base</label><input id="f-medico-base" autocomplete="new-password"></div>
        <div class="form-group"><label>Inviato da</label><input id="f-inviato-da" autocomplete="new-password"></div>
      </div>
      <div class="form-section">
        <h4>Note</h4>
        <div class="form-group"><textarea id="f-note" rows="4"></textarea></div>
      </div>
    </div>

    <!-- Tab Informazioni -->
    <div id="tab-info" class="tab-panel">
      <div class="form-section">
        <h4>Dati personali aggiuntivi</h4>
        <div class="form-row">
          <div class="form-group"><label>Professione</label><input id="f-professione" autocomplete="new-password"></div>
          <div class="form-group"><label>Titolo di studio</label><input id="f-titolo-studio" autocomplete="new-password"></div>
        </div>
        <div class="form-group">
          <label>Stato civile</label>
          <select id="f-stato-civile">
            <option value="">—</option>
            <option>Celibe/Nubile</option><option>Coniugato/a</option>
            <option>Separato/a</option><option>Divorziato/a</option><option>Vedovo/a</option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-secondary" id="btn-annulla-mod">Annulla</button>
      <button class="btn btn-primary" id="btn-salva">Salva paziente</button>
    </div>
  </div>
</div>
</template>

<script src="/assets/app.js"></script>
<script>
if (!requireAuth()) throw '';

let pazienti = [], pazienteCorrente = null, indiceCorrente = -1;

function normalizzaAnno(s) {
  if (!s) return s;
  const m = s.match(/^(\d{1,4})-(\d{2})-(\d{2})$/);
  if (!m) return s;
  let y = parseInt(m[1], 10);
  if (y < 100) y += 1900;
  return `${String(y).padStart(4, '0')}-${m[2]}-${m[3]}`;
}

/* ── Lista pazienti ──────────────────────────────────────────────────────── */
async function caricaLista(q = '') {
  const url = q ? `/api/pazienti?q=${encodeURIComponent(q)}&limit=100` : '/api/pazienti?limit=100';
  const res = await api(url);
  pazienti = res.pazienti;
  renderLista();
}

function renderLista() {
  const list = document.getElementById('pt-list');
  const count = document.getElementById('pt-count');
  list.innerHTML = '';
  if (!pazienti.length) {
    list.innerHTML = '<div style="padding:1rem;text-align:center;color:#bbb;font-size:.85rem">Nessun paziente</div>';
    count.textContent = '';
    return;
  }
  pazienti.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'pt-item' + (pazienteCorrente?.id === p.id ? ' active' : '');
    div.innerHTML = `<div class="pn">${p.cognome} ${p.nome}</div>
      <div class="pd">${p.data_nascita ? fmtData(p.data_nascita) : ''} ${p.codice_fiscale ? '· '+p.codice_fiscale : ''}</div>`;
    div.addEventListener('click', () => apriPaziente(p.id, i));
    list.appendChild(div);
  });
  count.textContent = `${pazienti.length} pazienti`;
}

/* ── Apertura scheda ─────────────────────────────────────────────────────── */
async function apriPaziente(id, idx) {
  if (idx !== undefined) indiceCorrente = idx;
  else indiceCorrente = pazienti.findIndex(p => p.id === id);
  const p = await api(`/api/pazienti/${id}`);
  pazienteCorrente = p;
  renderScheda(p);
  renderLista();
  if (window.innerWidth <= 768) {
    document.getElementById('anag-main').scrollIntoView({ behavior: 'smooth', block: 'start' });
    document.getElementById('btn-back-lista')?.classList.remove('hidden');
  }
}

function renderScheda(p) {
  const tpl = document.getElementById('tpl-scheda');
  const main = document.getElementById('anag-main');
  main.innerHTML = '';
  main.appendChild(tpl.content.cloneNode(true));

  initTabs(document.getElementById('tabs-anag'));
  initModalClose();

  document.getElementById('hdr-nome').textContent = `${p.cognome} ${p.nome}`;
  document.getElementById('hdr-cf').textContent = p.codice_fiscale || '';

  const campi = {
    'f-pax-cognome': p.cognome, 'f-pax-nome': p.nome,
    'f-data-nascita': normalizzaAnno(p.data_nascita) || '',
    'f-comune-nascita-cerca': p.luogo_nascita || '',
    'f-comune-nascita': p.codice_comune_nascita || '',
    'f-prov-nascita': p.provincia_nascita || '',
    'f-luogo-nascita': p.luogo_nascita || '',
    'f-cf': p.codice_fiscale || '',
    'f-comune-res': p.citta_residenza || '',
    'f-prov-res': p.provincia_residenza || '',
    'f-indirizzo': p.indirizzo || '', 'f-cap': p.cap || '',
    'f-telefono': p.telefono || '', 'f-email': p.email || '',
    'f-medico-base': p.medico_base || '', 'f-inviato-da': p.inviato_da || '',
    'f-note': p.note || '', 'f-professione': p.professione || '',
    'f-titolo-studio': p.titolo_studio || '',
  };
  Object.entries(campi).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
  document.getElementById('f-sesso').value = p.sesso || '';
  document.getElementById('f-stato-civile').value = p.stato_civile || '';

  if (p.cognome === 'Nuovo') { const el = document.getElementById('f-pax-cognome'); el.focus(); el.select(); }
  else if (p.nome === 'Paziente') { const el = document.getElementById('f-pax-nome'); el.focus(); el.select(); }

  // ── Stato pulsante Salva ─────────────────────────────────────────────────
  function abilitaSalva() {
    const btn = document.getElementById('btn-salva');
    if (!btn || !btn.classList.contains('btn-saved')) return; // già abilitato
    btn.disabled = false;
    btn.textContent = 'Salva paziente';
    btn.classList.remove('btn-saved');
  }
  // Qualsiasi modifica al form (input/change) riabilita il pulsante
  document.querySelector('.detail-body')?.addEventListener('input',  abilitaSalva);
  document.querySelector('.detail-body')?.addEventListener('change', abilitaSalva);

  // ── Autocomplete helper generico ────────────────────────────────────────
  function initAutocomplete({ inputEl, listEl, onSelect }) {
    let data = [];
    let focusedIdx = -1;

    function renderList() {
      listEl.innerHTML = '';
      focusedIdx = -1;
      if (!data.length) { listEl.classList.add('hidden'); return; }
      data.forEach((c, i) => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = `${c.nome} (${c.sigla_provincia})`;
        // mousedown invece di click per eseguire prima del blur
        item.addEventListener('mousedown', (e) => {
          e.preventDefault();
          onSelect(c);
          listEl.classList.add('hidden');
          data = [];
        });
        // touch support (iOS)
        item.addEventListener('touchstart', (e) => {
          e.preventDefault();
          onSelect(c);
          listEl.classList.add('hidden');
          data = [];
          inputEl.blur();
        }, { passive: false });
        listEl.appendChild(item);
      });
      listEl.classList.remove('hidden');
    }

    function updateFocus(newIdx) {
      const items = listEl.querySelectorAll('.autocomplete-item');
      items.forEach(el => el.classList.remove('ac-focused'));
      focusedIdx = Math.max(-1, Math.min(newIdx, items.length - 1));
      if (focusedIdx >= 0) {
        items[focusedIdx].classList.add('ac-focused');
        items[focusedIdx].scrollIntoView({ block: 'nearest' });
      }
    }

    inputEl.addEventListener('input', async () => {
      const q = inputEl.value.trim();
      if (q.length < 2) { data = []; listEl.classList.add('hidden'); return; }
      try {
        data = await api(`/api/comuni/cerca/${encodeURIComponent(q)}`);
        renderList();
      } catch(e) { data = []; listEl.classList.add('hidden'); }
    });

    inputEl.addEventListener('keydown', (e) => {
      if (listEl.classList.contains('hidden')) return;
      const items = listEl.querySelectorAll('.autocomplete-item');
      if (e.key === 'ArrowDown')  { e.preventDefault(); updateFocus(focusedIdx + 1); }
      if (e.key === 'ArrowUp')    { e.preventDefault(); updateFocus(focusedIdx - 1); }
      if (e.key === 'Enter' && focusedIdx >= 0) {
        e.preventDefault();
        const c = data[focusedIdx];
        if (c) { onSelect(c); listEl.classList.add('hidden'); data = []; }
      }
      if (e.key === 'Escape') { listEl.classList.add('hidden'); data = []; }
    });

    inputEl.addEventListener('blur', () => {
      // Piccolo delay per permettere il click/touch sull'item
      setTimeout(() => listEl.classList.add('hidden'), 250);
    });
  }

  // Autocomplete comune nascita
  const inputNasc  = document.getElementById('f-comune-nascita-cerca');
  const listNasc   = document.getElementById('list-comuni-nasc');
  const hiddenNasc = document.getElementById('f-comune-nascita');
  initAutocomplete({
    inputEl: inputNasc,
    listEl:  listNasc,
    onSelect: (c) => {
      inputNasc.value  = `${c.nome} (${c.sigla_provincia})`;
      hiddenNasc.value = c.codice_istat;
      document.getElementById('f-prov-nascita').value = c.sigla_provincia;
      ricalcolaCF();
      abilitaSalva();
    }
  });

  // Autocomplete comune residenza
  const inputRes = document.getElementById('f-comune-res');
  const listRes  = document.getElementById('list-comuni-res');
  initAutocomplete({
    inputEl: inputRes,
    listEl:  listRes,
    onSelect: (c) => {
      inputRes.value = c.nome;
      document.getElementById('f-prov-res').value = c.sigla_provincia;
      document.getElementById('f-cap').value = c.cap || '';
      abilitaSalva();
    }
  });

  // Autocomplete cognome → cerca paziente esistente
  const inputCognome = document.getElementById('f-pax-cognome');
  const listCognome  = document.getElementById('list-pax-cognome');
  let paxSuggeriti = [];
  let paxFocusIdx  = -1;

  function renderPaxSuggeriti() {
    listCognome.innerHTML = '';
    paxFocusIdx = -1;
    if (!paxSuggeriti.length) { listCognome.classList.add('hidden'); return; }
    paxSuggeriti.forEach((px) => {
      const item = document.createElement('div');
      item.className = 'autocomplete-item';
      item.textContent = `${px.cognome} ${px.nome}${px.data_nascita ? ' · ' + fmtData(px.data_nascita) : ''}`;
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        listCognome.classList.add('hidden'); paxSuggeriti = [];
        apriPaziente(px.id);
      });
      item.addEventListener('touchstart', (e) => {
        e.preventDefault();
        listCognome.classList.add('hidden'); paxSuggeriti = [];
        apriPaziente(px.id);
        inputCognome.blur();
      }, { passive: false });
      listCognome.appendChild(item);
    });
    listCognome.classList.remove('hidden');
  }

  function aggiornaPaxFocus(idx) {
    const items = listCognome.querySelectorAll('.autocomplete-item');
    items.forEach(el => el.classList.remove('ac-focused'));
    paxFocusIdx = Math.max(-1, Math.min(idx, items.length - 1));
    if (paxFocusIdx >= 0) {
      items[paxFocusIdx].classList.add('ac-focused');
      items[paxFocusIdx].scrollIntoView({ block: 'nearest' });
    }
  }

  inputCognome.addEventListener('input', async () => {
    const q = inputCognome.value.trim();
    if (q.length < 2) { paxSuggeriti = []; listCognome.classList.add('hidden'); return; }
    try {
      const res = await api(`/api/pazienti/cerca?q=${encodeURIComponent(q)}`);
      paxSuggeriti = (res.pazienti || res).filter(px => px.id !== pazienteCorrente?.id);
      renderPaxSuggeriti();
    } catch(e) { paxSuggeriti = []; listCognome.classList.add('hidden'); }
  });

  inputCognome.addEventListener('keydown', (e) => {
    if (listCognome.classList.contains('hidden')) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); aggiornaPaxFocus(paxFocusIdx + 1); }
    if (e.key === 'ArrowUp')   { e.preventDefault(); aggiornaPaxFocus(paxFocusIdx - 1); }
    if (e.key === 'Enter' && paxFocusIdx >= 0) {
      e.preventDefault();
      const px = paxSuggeriti[paxFocusIdx];
      if (px) { listCognome.classList.add('hidden'); paxSuggeriti = []; apriPaziente(px.id); }
    }
    if (e.key === 'Escape') { listCognome.classList.add('hidden'); paxSuggeriti = []; }
  });

  inputCognome.addEventListener('blur', () => {
    setTimeout(() => listCognome.classList.add('hidden'), 250);
  });

  // CF auto
  ['f-pax-cognome','f-pax-nome','f-data-nascita','f-sesso'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', ricalcolaCF);
  });

  // Duplicati
  ['f-pax-cognome','f-pax-nome'].forEach(id => {
    document.getElementById(id)?.addEventListener('blur', controllaDuplicati);
  });

  // Nav
  document.getElementById('btn-prev').addEventListener('click', () => {
    if (indiceCorrente > 0) apriPaziente(pazienti[indiceCorrente-1].id, indiceCorrente-1);
  });
  document.getElementById('btn-next').addEventListener('click', () => {
    if (indiceCorrente < pazienti.length-1) apriPaziente(pazienti[indiceCorrente+1].id, indiceCorrente+1);
  });

  // Salva
  document.getElementById('btn-salva').addEventListener('click', salvaPaziente);
  document.getElementById('btn-annulla-mod').addEventListener('click', () => apriPaziente(p.id));
  document.getElementById('btn-elimina').addEventListener('click', eliminaPaziente);
}

function ricalcolaCF() {
  const cognome = document.getElementById('f-pax-cognome')?.value;
  const nome    = document.getElementById('f-pax-nome')?.value;
  const dn      = document.getElementById('f-data-nascita')?.value;
  const sesso   = document.getElementById('f-sesso')?.value;
  const codice  = document.getElementById('f-comune-nascita')?.value;
  if (cognome && nome && dn && sesso && codice) {
    const cf = calcolaCodiceFiscale(cognome, nome, dn, sesso, codice);
    document.getElementById('f-cf').value = cf;
    document.getElementById('hdr-cf').textContent = cf;
  }
}

async function controllaDuplicati() {
  if (!pazienteCorrente) return;
  try {
    const dups = await api(`/api/pazienti/${pazienteCorrente.id}/duplicati`);
    const banner = document.getElementById('dup-banner');
    if (dups.length > 0) {
      banner.textContent = `⚠️ Possibili duplicati: ${dups.map(d=>d.cognome+' '+d.nome).join(', ')}`;
      banner.classList.remove('hidden');
    } else {
      banner.classList.add('hidden');
    }
  } catch(e) {}
}

async function salvaPaziente() {
  const btn = document.getElementById('btn-salva');
  btn.disabled = true; btn.textContent = 'Salvataggio...'; btn.classList.remove('btn-saved');
  const alert = document.getElementById('alert-scheda');
  alert.innerHTML = '';
  const body = {
    cognome:             document.getElementById('f-pax-cognome').value.trim(),
    nome:                document.getElementById('f-pax-nome').value.trim(),
    data_nascita:        normalizzaAnno(document.getElementById('f-data-nascita').value) || null,
    sesso:               document.getElementById('f-sesso').value || null,
    codice_comune_nascita: document.getElementById('f-comune-nascita').value || null,
    provincia_nascita:   document.getElementById('f-prov-nascita').value.toUpperCase() || null,
    luogo_nascita:       document.getElementById('f-comune-nascita-cerca').value || document.getElementById('f-luogo-nascita').value || null,
    codice_fiscale:      document.getElementById('f-cf').value.trim() || null,
    indirizzo:           document.getElementById('f-indirizzo').value || null,
    cap:                 document.getElementById('f-cap').value || null,
    citta_residenza:     document.getElementById('f-comune-res').value || null,
    provincia_residenza: document.getElementById('f-prov-res').value.toUpperCase() || null,
    telefono:            document.getElementById('f-telefono').value || null,
    email:               document.getElementById('f-email').value || null,
    medico_base:         document.getElementById('f-medico-base').value || null,
    inviato_da:          document.getElementById('f-inviato-da').value || null,
    note:                document.getElementById('f-note').value || null,
    professione:         document.getElementById('f-professione').value || null,
    titolo_studio:       document.getElementById('f-titolo-studio').value || null,
    stato_civile:        document.getElementById('f-stato-civile').value || null,
  };
  const cognomeLower = body.cognome.toLowerCase();
  const nomeLower    = body.nome.toLowerCase();
  const duplic = pazienti.find(p =>
    p.id !== pazienteCorrente.id &&
    p.cognome.toLowerCase() === cognomeLower &&
    p.nome.toLowerCase() === nomeLower
  );
  if (duplic) {
    if (!confirm(`Esiste già un paziente con questo nome (${duplic.cognome} ${duplic.nome}). Continuare?`)) {
      btn.disabled = false; btn.textContent = 'Salva paziente';
      apriPaziente(pazienteCorrente.id);
      return;
    }
  }

  try {
    const updated = await api(`/api/pazienti/${pazienteCorrente.id}`, { method:'PUT', body:JSON.stringify(body) });
    pazienteCorrente = updated;
    alert.innerHTML = '<div class="alert alert-success">Paziente salvato.</div>';
    document.getElementById('hdr-nome').textContent = `${updated.cognome} ${updated.nome}`;
    document.getElementById('hdr-cf').textContent = updated.codice_fiscale || '';
    await caricaLista(document.getElementById('search-input').value);
    // Successo: il pulsante rimane disabilitato con aspetto "salvato"
    btn.textContent = 'Salvato ✓';
    btn.classList.add('btn-saved');
  } catch(e) {
    alert.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    // Errore: ripristina il pulsante così l'utente può riprovare
    btn.disabled = false; btn.textContent = 'Salva paziente';
  }
}

async function eliminaPaziente() {
  if (!confirm(`Eliminare ${pazienteCorrente.cognome} ${pazienteCorrente.nome}?`)) return;
  const idxElim = indiceCorrente;
  try {
    await api(`/api/pazienti/${pazienteCorrente.id}`, { method:'DELETE' });
    pazienteCorrente = null;
    indiceCorrente = -1;
    await caricaLista();
    if (pazienti.length === 0) {
      document.getElementById('anag-main').innerHTML = '<div class="empty-state"><div class="e-icon">✅</div><p>Nessun paziente.</p></div>';
    } else if (idxElim > 0) {
      apriPaziente(pazienti[idxElim - 1].id, idxElim - 1);
    } else {
      apriPaziente(pazienti[0].id, 0);
    }
  } catch(e) { alert('Errore: ' + e.message); }
}

/* ── Nuovo paziente ─────────────────────────────────────────────────────── */
document.getElementById('btn-nuovo').addEventListener('click', async () => {
  try {
    const p = await api('/api/pazienti', {
      method: 'POST',
      body: JSON.stringify({ cognome: 'Nuovo', nome: 'Paziente' })
    });
    await caricaLista();
    apriPaziente(p.id);
  } catch(e) { alert('Errore: ' + e.message); }
});

/* ── Ricerca ─────────────────────────────────────────────────────────────── */
let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => caricaLista(e.target.value.trim()), 300);
});

// Init
caricaLista();
</script>
</body>
